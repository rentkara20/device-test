<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اختبار الجهاز</title>
<style>
:root{color-scheme:dark;--ink:#eef2f1;--muted:#aab8b5;--line:#30403f;--accent:#79d7a1;--bad:#ff8c85;--panel:#14201f}*{box-sizing:border-box}body{margin:0;background:#0d1514;color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}main{min-height:100svh;max-width:620px;margin:auto;padding:18px 18px 28px;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1,h2,p{margin:0}h1{font-size:22px}h2{font-size:27px;line-height:1.25;margin-bottom:12px}.code{font:13px ui-monospace,monospace;color:var(--muted);direction:ltr}.dots{display:flex;gap:7px;justify-content:center;margin-bottom:24px}.dot{width:9px;height:9px;border-radius:50%;background:#33413f}.dot.active{background:var(--accent);box-shadow:0 0 0 4px #79d7a122}.screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 16px 45px #0003}.hint{color:var(--muted);font-size:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}button{min-height:52px;border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:#20302e;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#092016}button.danger{background:#3a201f;color:#ffd1cd;border-color:#73413e}button.skip{background:transparent;color:var(--muted);grid-column:1/-1}.touch-grid{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(14,1fr);gap:3px;height:min(62svh,580px);touch-action:none}.cell{border-radius:3px;background:#263936}.cell.hit{background:#59cf8f}.colour-stage{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;padding:28px;background:#fff;color:#111}.colour-stage button{background:#111;color:#fff;border:0;min-width:180px}.meter{height:15px;border-radius:20px;background:#263936;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .08s}.preview{width:100%;max-height:52svh;border-radius:16px;background:#050807;object-fit:cover}.torch{display:flex;align-items:center;gap:10px;color:var(--muted)}.torch input{width:24px;height:24px}.results{display:grid;gap:8px;margin:16px 0}.result{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}.result.pass{color:var(--accent)}.result.fail{color:var(--bad)}.result.skip{color:var(--muted)}.result-code{font:24px ui-monospace,monospace;letter-spacing:2px;text-align:center;margin:12px 0;color:var(--accent)}@media(max-width:380px){main{padding-inline:12px}.card{padding:18px}h2{font-size:24px}}
</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><style>html,body{min-height:100dvh}</style></head>
<body><main><header><h1>فحص الجهاز</h1><span id="code" class="code"></span></header><div id="dots" class="dots" aria-label="التقدم"></div><section id="screen" class="screen"></section></main>
<script>
"use strict";
const steps=["الشاشة","اللمس","السماعة","المايك","الكاميرا الأمامية","الكاميرا الخلفية","الاهتزاز","الأزرار"],results=Array(8).fill(null);let index=0,stream=null,audioContext=null,recorder=null,chunks=[];
const $=s=>document.querySelector(s),make=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
document.addEventListener("DOMContentLoaded",()=>{const code=new URLSearchParams(location.search).get("code");$("#code").textContent=code?code:"بدون كود";drawDots();show()});
function drawDots(){const dots=$("#dots");dots.replaceChildren();steps.forEach((_,i)=>dots.append(make("i",undefined,`dot${i===index?" active":""}`)))}
function cleanMedia(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(recorder&&recorder.state!=="inactive")recorder.stop();recorder=null}
function finish(value){results[index]=value;cleanMedia();if(index===steps.length-1){finalScreen();return}index++;drawDots();show()}
function actions(){const box=make("div",undefined,"actions"),yes=make("button","✓ شغّال","primary"),no=make("button","✕ فيه مشكلة","danger"),skip=make("button","تخطّي","skip");yes.onclick=()=>finish("1");no.onclick=()=>finish("0");skip.onclick=()=>finish("-");box.append(yes,no,skip);return box}
function show(){cleanMedia();const root=$("#screen");root.replaceChildren();if(index===0){colourTest(root);return}const card=make("div",undefined,"card");card.append(make("h2",steps[index]));if(index===1)touchTest(card);if(index===2)speakerTest(card);if(index===3)micTest(card);if(index===4)cameraTest(card,"user");if(index===5)cameraTest(card,"environment");if(index===6)vibrationTest(card);if(index===7)buttonsTest(card);root.append(card)}
function colourTest(root){const stage=make("div",undefined,"colour-stage"),button=make("button","اضغط للون التالي");let colours=["#e33b35","#35bd70","#397ee8","#fff","#000"],pos=0;stage.style.background=colours[0];button.onclick=()=>{pos++;if(pos<colours.length)stage.style.background=colours[pos];else{stage.remove();const card=make("div",undefined,"card");card.append(make("h2","اختبار الشاشة"),make("p","في نقط أو بقع؟","hint"),actions());root.append(card)}};stage.append(button);document.body.append(stage)}
function touchTest(card){card.append(make("p","المس كل الخانات أو مرر إصبعك عليها حتى تصبح خضراء.","hint"));const grid=make("div",undefined,"touch-grid"),cells=[];for(let i=0;i<112;i++){const c=make("i",undefined,"cell");cells.push(c);grid.append(c)}const hit=e=>{e.preventDefault();const t=e.touches?e.touches[0]:e;const el=document.elementFromPoint(t.clientX,t.clientY);if(el&&el.classList.contains("cell")){el.classList.add("hit");if(cells.every(x=>x.classList.contains("hit")))finish("1")}};grid.addEventListener("touchstart",hit,{passive:false});grid.addEventListener("touchmove",hit,{passive:false});grid.addEventListener("pointerdown",hit);grid.addEventListener("pointermove",e=>{if(e.buttons)hit(e)});card.append(grid,actions())}
// iPhone 7+ has stereo speakers: in portrait one channel is the top earpiece, the other the bottom speaker.
// TOP_PAN is the channel that comes out of the top; flip to 1 if a real iPhone shows it reversed.
const TOP_PAN=-1;
function tone(pan){if("audioSession" in navigator){try{navigator.audioSession.type="playback"}catch{}}
audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();audioContext.resume();const t=audioContext.currentTime,o=audioContext.createOscillator(),g=audioContext.createGain();o.type="sine";o.frequency.setValueAtTime(660,t);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+1.5);let node=o.connect(g);if(audioContext.createStereoPanner){const p=audioContext.createStereoPanner();p.pan.value=pan;node=node.connect(p)}node.connect(audioContext.destination);o.start(t);o.stop(t+1.5)}
function speakerTest(card){card.append(make("p","امسك الجهاز بالطول، ارفع الصوت، وشيل وضع الصامت.","hint"));const arrow=make("div","","hint");arrow.style.cssText="font-size:64px;line-height:1;min-height:70px;text-align:center";
const top=make("button","⬆ السماعة اللي فوق","primary"),bottom=make("button","⬇ السماعة اللي تحت","primary");
top.onclick=()=>{arrow.textContent="⬆ الصوت طالع من هنا (فوق)";try{tone(TOP_PAN)}catch{}};
bottom.onclick=()=>{arrow.textContent="⬇ الصوت طالع من تحت";try{tone(-TOP_PAN)}catch{}};
card.append(arrow,top,bottom,make("p","سمعت الصوت من السماعتين؟ (الأجهزة القديمة قبل آيفون 7 فيها سماعة تحت بس)","hint"),actions())}
function micTest(card){card.append(make("p","سجّل 3 ثواني، ثم اسمع التسجيل.","hint"));const start=make("button","● ابدأ التسجيل","primary"),meter=make("div",undefined,"meter"),bar=make("i");meter.append(bar);const msg=make("p","","hint");start.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const ctx=new AudioContext(),source=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();source.connect(an);an.fftSize=256;const data=new Uint8Array(an.frequencyBinCount),level=()=>{an.getByteTimeDomainData(data);let sum=0;data.forEach(v=>{const n=(v-128)/128;sum+=n*n});bar.style.width=Math.min(100,Math.sqrt(sum/data.length)*300)+"%";if(recorder&&recorder.state!=="inactive")requestAnimationFrame(level)};recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{const audio=new Audio(URL.createObjectURL(new Blob(chunks,{type:"audio/webm"})));audio.controls=true;card.append(audio);msg.textContent=""};recorder.start();level();start.disabled=true;setTimeout(()=>{if(recorder&&recorder.state!=="inactive")recorder.stop()},3000)}catch{msg.textContent="لم نقدر نستخدم المايك. يمكنك تخطّي الاختبار أو تسجيل المشكلة."}};card.append(start,meter,msg,make("p","سمعت صوتك؟","hint"),actions())}
// iPhones with 2-3 back lenses list each one separately (Safari names them in English).
const CAM_NAMES=[[/ultra ?wide/i,"الواسعة جدًا (0.5x)"],[/tele/i,"الزووم"],[/triple|dual|wide|back|rear|environment/i,"الأساسية (1x)"]];
function camName(label,i){const hit=CAM_NAMES.find(([re])=>re.test(label||""));return hit?hit[1]:"كاميرا "+(i+1)}
async function allCameras(card,video){let cams=[];try{cams=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput"&&!/front|user|face/i.test(d.label))}catch{}
if(cams.length<2)return;const row=make("div","","cam-row");row.style.cssText="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0";
card.append(make("p","الجهاز فيه "+cams.length+" كاميرات خلفية — جرّب كل واحدة:","hint"),row);
cams.forEach((c,i)=>{const b=make("button","📷 "+camName(c.label,i),"primary");b.onclick=async()=>{try{stream&&stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:c.deviceId}}});video.srcObject=stream;row.querySelectorAll("button").forEach(x=>x.style.outline="");b.style.outline="3px solid #2e7d32"}catch{b.textContent="✕ "+camName(c.label,i)+" مش شغالة"}};row.append(b)})}
async function cameraTest(card,mode){card.append(make("p",mode==="user"?"انظر إلى الكاميرا الأمامية.":"انظر إلى الكاميرا الخلفية.","hint"));const video=make("video",undefined,"preview");video.autoplay=true;video.playsInline=true;card.append(video);try{stream=await navigator.mediaDevices.getUserMedia({video:mode==="user"?{facingMode:"user"}:{facingMode:{exact:"environment"}}});video.srcObject=stream}catch{if(mode!=="user"){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});video.srcObject=stream}catch{card.append(make("p","لم نقدر نفتح الكاميرا. يمكنك تخطّي الاختبار.","hint"))}}else card.append(make("p","لم نقدر نفتح الكاميرا الأمامية. يمكنك تخطّي الاختبار.","hint"))}if(mode!=="user"&&stream)await allCameras(card,video);if(mode!=="user"&&stream){const track=stream.getVideoTracks()[0],cap=track.getCapabilities?.();if(cap&&cap.torch){const label=make("label",undefined,"torch"),input=make("input");input.type="checkbox";input.onchange=()=>track.applyConstraints({advanced:[{torch:input.checked}]});label.append(input,make("span","الفلاش"));card.append(label)}}card.append(actions())}
// iPhone Safari has no vibrate(); toggling an <input switch> fires the Taptic Engine (iOS 18+).
function haptic(){if(navigator.vibrate){navigator.vibrate(300);return}const l=document.createElement("label"),i=document.createElement("input");i.type="checkbox";i.setAttribute("switch","");l.append(i);l.style.display="none";document.body.append(l);l.click();l.remove()}
function vibrationTest(card){card.append(make("p","اضغط الزر وحط إيدك على الجهاز — المفروض تحس نبضة.","hint"));const b=make("button","〰 جرّب الاهتزاز","primary");b.onclick=()=>{let n=0;const t=setInterval(()=>{haptic();if(++n>=6)clearInterval(t)},120)};card.append(b,make("p","حسّيت بالنبضة؟ (الآيفون لازم يكون iOS 18 أو أحدث)","hint"),actions())}
function buttonsTest(card){const list=make("ol","","hint");list.style.cssText="text-align:start;line-height:2";["اضغط زر رفع الصوت — يطلع مؤشر الصوت ويزيد","اضغط زر خفض الصوت — المؤشر ينقص","حرّك زر الصامت (أو زر الأكشن) — يطلع «صامت»","اضغط زر القفل مرة — الشاشة تطفي، وافتحها تاني"].forEach(t=>list.append(make("li",t)));card.append(make("p","جرّب الأزرار بنفسك:","hint"),list,make("p","كل الأزرار شغالة؟","hint"),actions())}
function finalScreen(){drawDots();const root=$("#screen");root.replaceChildren();const card=make("div",undefined,"card");card.append(make("h2","نتيجة الاختبار"));const list=make("div",undefined,"results");results.forEach((r,i)=>{const row=make("div",undefined,`result ${r==="1"?"pass":r==="0"?"fail":"skip"}`);row.append(make("span",steps[i]),make("b",r==="1"?"✓ شغّال":r==="0"?"✕ فيه مشكلة":"— تخطّي"));list.append(row)});const code="R-"+results.map(x=>x||"-").join("");const q=new URLSearchParams(location.search),shop=q.get("code"),topic=q.get("t");
const fallback=()=>{card.replaceChildren(make("h2","نتيجة الاختبار"),list,make("div",code,"result-code"),make("p","ورّي الشاشة دي لموظف المحل","hint"))};
if(shop&&topic&&/^[\w-]{10,64}$/.test(topic)){card.append(make("p","جاري إرسال النتيجة للمحل…","hint"));root.append(card);
// ntfy.sh relays the result to the shop station; only the report code and failed parts are sent
fetch("https://ntfy.sh/"+topic,{method:"POST",body:JSON.stringify({code:shop,failed:steps.filter((_,i)=>results[i]==="0")})}).then(r=>{if(!r.ok)throw 0;card.replaceChildren(make("h2","✓ شكرًا! النتيجة وصلت للمحل"),make("p","تقدر ترجّع الجهاز لموظف المحل.","hint"))}).catch(fallback);return}
fallback();root.append(card)}
</script><script>
// Fullscreen needs a tap first. Works on Android and iPad; iPhone Safari does not allow it for web pages.
document.addEventListener("pointerdown",function goFull(){var e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;if(f&&!document.fullscreenElement&&!document.webkitFullscreenElement){try{var r=f.call(e,{navigationUI:"hide"});r&&r.catch&&r.catch(function(){})}catch(_){}}},{once:true});
</script></body></html>
